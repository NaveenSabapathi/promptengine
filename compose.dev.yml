# Local PostgreSQL only. Full application deployment is Phase 6.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: promptengine
      POSTGRES_USER: promptengine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local database password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptengine -d promptengine"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_dev:
